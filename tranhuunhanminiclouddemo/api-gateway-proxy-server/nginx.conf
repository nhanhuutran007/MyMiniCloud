events {
    worker_connections 1024;
}

http {
    # DNS resolver để dynamic service discovery
    resolver 127.0.0.11 valid=30s ipv6=off;
    
    # Dynamic upstream cho web frontend - không cần định nghĩa trước
    # Docker sẽ tự động load balance giữa các instances của cùng service
    
    # Upstream cho application backend với dynamic resolution
    upstream app_backend {
        least_conn;
        server application-backend-server:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;

        # 🔹 Keycloak - Tất cả các path (ưu tiên cao)
        location ~ ^/(auth|realms|admin|js|resources)/ {
            proxy_pass http://authentication-identity-server:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 🔹 App API (strip /api/, backend handle các path phía sau)
        location /api/ {
            set $backend "application-backend-server:8081";
            proxy_pass http://$backend/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 🔹 EXT 9: route /student/ -> Flask /student
        location /student/ {
            set $backend "application-backend-server:8081";
            proxy_pass http://$backend/student;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 🔹 EXT: route /api/students-db -> Flask /students-db
        location /api/students-db {
            set $backend "application-backend-server:8081";
            proxy_pass http://$backend/students-db;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 🔹 Web frontend với Docker's built-in load balancing (cuối cùng)
        location / {
            # Docker tự động load balance giữa các instances của web-frontend-server
            proxy_pass http://web-frontend-server:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # 🔹 Server riêng cho port 8080 - Web Frontend Load Balancer
    server {
        listen 8080;

        # 🔹 Keycloak routing cho port 8080 (ưu tiên cao)
        location ~ ^/(auth|realms|admin|js|resources)/ {
            proxy_pass http://authentication-identity-server:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 🔹 API routing cho port 8080 (nếu cần)
        location /api/ {
            set $backend "application-backend-server:8081";
            proxy_pass http://$backend/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 🔹 Web frontend với Docker's built-in load balancing (cuối cùng)
        location / {
            # Docker tự động load balance giữa các instances của web-frontend-server
            proxy_pass http://web-frontend-server:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Load balancing settings
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
