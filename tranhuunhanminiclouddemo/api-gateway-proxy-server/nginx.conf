events {
    worker_connections 1024;
}

http {
    # DNS resolver để dynamic service discovery (Docker internal DNS)
    resolver 127.0.0.11 valid=5s;
    
    # ── MAPPING DYNAMIC TARGETS ──
    # Việc dùng biến khiến nginx phải resolve DNS lại sau mỗi khoảng 'valid'
    
    server {
        listen 80;

        # 🔹 Keycloak - Tất cả các path (ưu tiên cao)
        location ~ ^/(auth|realms|admin|js|resources)/ {
            set $auth_target "http://authentication-identity-server:8080";
            proxy_pass $auth_target;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🔹 App API (Đảm bảo match chính xác /api/ và redirect/rewrite đúng)
        location /api/ {
            set $backend_target "http://application-backend-server:8081";
            rewrite ^/api/(.*) /$1 break;
            proxy_pass $backend_target;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Flask support
            proxy_redirect off;
            proxy_buffering off;
        }

        # 🔹 Student HTML legacy route
        location /student/ {
            set $backend_target "http://application-backend-server:8081";
            rewrite ^/student/?(.*) /student$1 break;
            proxy_pass $backend_target;
            proxy_set_header Host $host;
        }

        # 🔹 Web frontend với Real Load Balancing rotation
        location / {
            # Sử dụng biến buộc Nginx re-resolve DNS của Docker sau mỗi 5 giây
            set $web_target "http://web-frontend-server:80";
            proxy_pass $web_target;
            
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable caching for LB testing
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # 🔹 Server riêng cho port 8080 (Duy trì tính tương thích)
    server {
        listen 8080;

        # 🔹 Keycloak - Tất cả các path (ưu tiên cao)
        location ~ ^/(auth|realms|admin|js|resources)/ {
            set $auth_target "http://authentication-identity-server:8080";
            proxy_pass $auth_target;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            set $backend_target "http://application-backend-server:8081";
            rewrite ^/api/(.*) /$1 break;
            proxy_pass $backend_target;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $web_target "http://web-frontend-server:80";
            proxy_pass $web_target;
            
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
