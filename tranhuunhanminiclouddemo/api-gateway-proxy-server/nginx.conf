events {}

http {
    # DNS resolver để dynamic service discovery
    resolver 127.0.0.11 valid=30s;
    
    # Upstream cho web frontend – Docker sẽ tự động load balance giữa các replicas
    upstream web_frontend {
        server web-frontend-server:80;
        # Docker's internal DNS sẽ tự động round-robin giữa các replicas
    }

    server {
        listen 80;

        # 🔹 Web tĩnh qua load balancer
        location / {
            proxy_pass http://web_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🔹 App API (strip /api/, backend handle các path phía sau)
        location /api/ {
            proxy_pass http://application-backend-server:8081/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🔹 Keycloak
        location /auth/ {
            proxy_pass http://authentication-identity-server:8080/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🔹 EXT 9: route /student/ -> Flask /student
        location /student/ {
            proxy_pass http://application-backend-server:8081/student;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🔹 EXT: route /api/students-db -> Flask /students-db
        location /api/students-db {
            proxy_pass http://application-backend-server:8081/students-db;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
