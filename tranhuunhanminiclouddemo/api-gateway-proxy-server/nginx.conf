events {
    worker_connections 1024;
}

http {
    # DNS resolver để dynamic service discovery
    resolver 127.0.0.11 valid=30s ipv6=off;
    
    # Upstream cho web frontend với dynamic resolution
    upstream web_frontend {
        least_conn;
        # Sử dụng variable để force DNS resolution mỗi request
        server web-frontend-server:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Upstream cho application backend với dynamic resolution
    upstream app_backend {
        least_conn;
        server application-backend-server:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;

        # 🔹 Web tĩnh qua load balancer với dynamic DNS
        location / {
            # Sử dụng variable để force DNS lookup mỗi request
            set $backend "web-frontend-server:80";
            proxy_pass http://$backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 🔹 App API (strip /api/, backend handle các path phía sau)
        location /api/ {
            set $backend "application-backend-server:8081";
            proxy_pass http://$backend/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 🔹 Keycloak
        location /auth/ {
            proxy_pass http://authentication-identity-server:8080/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 🔹 EXT 9: route /student/ -> Flask /student
        location /student/ {
            set $backend "application-backend-server:8081";
            proxy_pass http://$backend/student;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 🔹 EXT: route /api/students-db -> Flask /students-db
        location /api/students-db {
            set $backend "application-backend-server:8081";
            proxy_pass http://$backend/students-db;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
