
networks:
  cloud-net:
    name: cloud-net

services:
  web-frontend-server:
    # build: ./web-frontend-server
    image: nhanhuutran007/myminicloud-web:latest
    container_name: web-frontend-server
    networks:
      - cloud-net
    ports:
      - "8080:80"
    restart: unless-stopped

  web-frontend-server-1:
    # build: ./web-frontend-server-1
    image: nhanhuutran007/myminicloud-web1:latest
    container_name: web-frontend-server-1
    networks:
      - cloud-net
    # ports:
    #   - "8082:80"
    restart: unless-stopped

  web-frontend-server-2:
    # build: ./web-frontend-server-2
    image: nhanhuutran007/myminicloud-web2:latest
    container_name: web-frontend-server-2
    networks:
      - cloud-net
    # ports:
    #   - "8083:80"
    restart: unless-stopped

  application-backend-server:
    # build: ./application-backend-server
    image: nhanhuutran007/myminicloud-app:latest
    container_name: application-backend-server
    networks:
      - cloud-net
    ports:
      - "8085:8081"
    environment:
      OIDC_ISSUER: "http://authentication-identity-server:8080/realms/TranHuuNhan_52300235"
      OIDC_AUDIENCE: "account"
      OIDC_INTROSPECT_URL: "http://localhost:8081/realms/TranHuuNhan_52300235/protocol/openid-connect/token/introspect"
      OIDC_INTROSPECT_CLIENT_ID: "backend-introspect"
      OIDC_INTROSPECT_CLIENT_SECRET: "xoVeDIeu2SPJ9Lj8y4AY36sVMNvEKbtO"
      # Chọn chế độ xác thực:
      OIDC_MODE: "introspect"
      # Kết nối MariaDB
      DB_HOST: "relational-database-server"
      DB_USER: "root"
      DB_PASSWORD: "root"
      DB_NAME: "studentdb"
    restart: unless-stopped 
      

  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
      - mariadb-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - cloud-net
    restart: unless-stopped

  authentication-identity-server:
    image: quay.io/keycloak/keycloak:latest
    container_name: authentication-identity-server
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - cloud-net

  object-storage-server:
    image: minio/minio
    container_name: object-storage-server
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./object-storage-server/data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - cloud-net
    restart: unless-stopped

  internal-dns-server:
    build: ./internal-dns-server
    container_name: internal-dns-server
    networks:
      - cloud-net
    restart: unless-stopped
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"


  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    ports:
      - "9100:9100"
    networks:
      - cloud-net
    restart: unless-stopped

  monitoring-prometheus-server:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus-server
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - cloud-net
    restart: unless-stopped

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    ports:
      - "3000:3000"
    networks:
      - cloud-net
    restart: unless-stopped

  api-gateway-proxy-server:
    image: nginx:stable
    container_name: api-gateway-proxy-server
    depends_on:
      - web-frontend-server
      - application-backend-server
      - authentication-identity-server
    ports:
      - "80:80"
    volumes:
      - ./api-gateway-proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cloud-net
    restart: unless-stopped

volumes:
  mariadb-data:
    name: mariadb-data
