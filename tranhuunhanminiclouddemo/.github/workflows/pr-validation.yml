name: Pull Request Validation

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  # Quick validation for PRs
  pr-checks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for comparison
      
      - name: Validate project structure
        run: |
          echo "🔍 Validating project structure..."
          
          # Check if main directory exists
          if [ ! -d "tranhuunhanminiclouddemo" ]; then
            echo "❌ Main project directory not found"
            exit 1
          fi
          
          # Check if docker-compose.yml exists
          if [ ! -f "tranhuunhanminiclouddemo/docker-compose.yml" ]; then
            echo "❌ docker-compose.yml not found"
            exit 1
          fi
          
          echo "✅ Project structure is valid"
      
      - name: Validate Docker Compose
        run: |
          cd tranhuunhanminiclouddemo
          echo "🔍 Validating Docker Compose configuration..."
          docker compose config
          echo "✅ Docker Compose configuration is valid"
      
      - name: Check for sensitive data
        run: |
          echo "🔍 Checking for sensitive data..."
          
          # Check for common sensitive patterns (excluding .github directory)
          if git diff --name-only origin/main...HEAD | xargs grep -l -i "password.*=" 2>/dev/null | grep -v ".github" | grep -v "example" | grep -v ".yml"; then
            echo "⚠️ Potential sensitive data found in changed files!"
            echo "Please review and use environment variables or secrets instead."
            exit 1
          fi
          
          if git diff --name-only origin/main...HEAD | xargs grep -l -i "secret.*=" 2>/dev/null | grep -v ".github" | grep -v "example" | grep -v ".yml"; then
            echo "⚠️ Potential secrets found in changed files!"
            echo "Please review and use environment variables or secrets instead."
            exit 1
          fi
          
          echo "✅ No sensitive data detected"
      
      - name: Lint Dockerfiles
        run: |
          echo "🔍 Linting Dockerfiles..."
          
          # Find all Dockerfiles in the project
          dockerfiles=$(find tranhuunhanminiclouddemo -name "Dockerfile" -type f)
          
          if [ -z "$dockerfiles" ]; then
            echo "⚠️ No Dockerfiles found"
            exit 0
          fi
          
          for dockerfile in $dockerfiles; do
            echo "Checking $dockerfile..."
            
            # Basic Dockerfile validation
            if ! grep -q "FROM" "$dockerfile"; then
              echo "❌ $dockerfile missing FROM instruction"
              exit 1
            fi
            
            # Check for best practices
            if grep -q "ADD.*http" "$dockerfile"; then
              echo "⚠️ $dockerfile uses ADD with URL, consider using RUN with curl/wget"
            fi
            
            if grep -q "RUN.*apt-get update" "$dockerfile" && ! grep -q "apt-get clean" "$dockerfile"; then
              echo "⚠️ $dockerfile should clean apt cache after update"
            fi
            
            echo "✅ $dockerfile looks good"
          done
      
      - name: Check documentation updates
        run: |
          echo "🔍 Checking documentation updates..."
          
          # Get list of changed files
          changed_files=$(git diff --name-only origin/main...HEAD)
          
          # Check if docker-compose.yml changed but README wasn't updated
          if echo "$changed_files" | grep -q "docker-compose.yml"; then
            if ! echo "$changed_files" | grep -q "README.md"; then
              echo "⚠️ docker-compose.yml changed but README.md wasn't updated"
              echo "Consider updating documentation to reflect the changes"
            fi
          fi
          
          # Check if new services were added
          if echo "$changed_files" | grep -q "docker-compose.yml"; then
            echo "📋 Docker Compose changes detected, please ensure:"
            echo "  - README.md is updated with new service information"
            echo "  - Health check scripts include new services"
            echo "  - Port mappings are documented"
          fi
          
          echo "✅ Documentation check completed"
      
      - name: Quick smoke test
        run: |
          cd tranhuunhanminiclouddemo
          echo "🔍 Running quick smoke test..."
          
          # Test building one service to catch obvious errors
          services_to_test=("web-frontend-server" "application-backend-server" "internal-dns-server")
          
          for service in "${services_to_test[@]}"; do
            if [ -f "$service/Dockerfile" ]; then
              echo "🔨 Testing build for $service..."
              if docker build -t smoke-test-$service ./$service; then
                echo "✅ $service builds successfully"
                docker rmi smoke-test-$service || true
              else
                echo "❌ $service build failed"
                exit 1
              fi
            fi
          done
          
          echo "✅ Smoke test completed"
      
      - name: Validate CI/CD configuration
        run: |
          echo "🔍 Validating CI/CD configuration..."
          
          # Check if required CI/CD files exist
          required_files=(
            ".github/workflows/ci-cd.yml"
            ".github/configs/project-config.yml"
            ".github/scripts/deploy.sh"
          )
          
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Required CI/CD file missing: $file"
              exit 1
            fi
          done
          
          # Validate YAML syntax for workflows
          for workflow in .github/workflows/*.yml; do
            if [ -f "$workflow" ]; then
              echo "Validating $workflow..."
              # Basic YAML validation (in real scenario, use yamllint)
              if ! python3 -c "import yaml; yaml.safe_load(open('$workflow'))" 2>/dev/null; then
                echo "❌ Invalid YAML syntax in $workflow"
                exit 1
              fi
            fi
          done
          
          echo "✅ CI/CD configuration is valid"
      
      - name: Security scan
        run: |
          echo "🔍 Running security scan on changed files..."
          
          # Get changed files
          changed_files=$(git diff --name-only origin/main...HEAD)
          
          if [ -n "$changed_files" ]; then
            echo "Changed files:"
            echo "$changed_files"
            
            # Run basic security checks
            for file in $changed_files; do
              if [ -f "$file" ]; then
                # Check for common security issues
                if grep -q "eval\|exec\|system" "$file" 2>/dev/null; then
                  echo "⚠️ Potentially dangerous function found in $file"
                fi
                
                if grep -q "curl.*|.*sh\|wget.*|.*sh" "$file" 2>/dev/null; then
                  echo "⚠️ Potentially dangerous pipe to shell found in $file"
                fi
              fi
            done
          fi
          
          echo "✅ Security scan completed"

  # Summary comment on PR
  pr-summary:
    runs-on: ubuntu-latest
    needs: pr-checks
    if: always()
    
    steps:
      - name: PR Summary
        run: |
          echo "📋 Pull Request Validation Summary"
          echo "================================="
          
          if [ "${{ needs.pr-checks.result }}" == "success" ]; then
            echo "✅ All validation checks passed!"
            echo ""
            echo "This PR is ready for review. The following checks were performed:"
            echo "- Project structure validation"
            echo "- Docker Compose configuration validation"
            echo "- Sensitive data detection"
            echo "- Dockerfile linting"
            echo "- Documentation consistency check"
            echo "- Smoke testing of Docker builds"
            echo "- CI/CD configuration validation"
            echo "- Basic security scanning"
          else
            echo "❌ Some validation checks failed."
            echo "Please review the failed checks above and fix the issues."
          fi