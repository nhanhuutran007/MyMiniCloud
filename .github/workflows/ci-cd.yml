name: Universal Docker Compose CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_CONFIG: .github/configs/project-config.yml

jobs:
  # Load project configuration
  load-config:
    runs-on: ubuntu-latest
    outputs:
      project-name: ${{ steps.config.outputs.project-name }}
      main-directory: ${{ steps.config.outputs.main-directory }}
      docker-services: ${{ steps.config.outputs.docker-services }}
    steps:
      - uses: actions/checkout@v4
      - name: Load project configuration
        id: config
        run: |
          # Parse YAML config (simplified - in real scenario use yq)
          echo "project-name=MyMiniCloud" >> $GITHUB_OUTPUT
          echo "main-directory=tranhuunhanminiclouddemo" >> $GITHUB_OUTPUT
          echo "docker-services=[\"web-frontend-server\",\"application-backend-server\",\"internal-dns-server\"]" >> $GITHUB_OUTPUT

  # Security and validation
  security-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
      
      - name: Validate Docker Compose
        run: |
          cd ${{ needs.load-config.outputs.main-directory || 'tranhuunhanminiclouddemo' }}
          docker compose config
          echo "✅ Docker Compose configuration is valid"
      
      - name: Check for secrets in code
        run: |
          echo "🔍 Scanning for potential secrets..."
          matches=$(find . -type f \( -name "*.py" -o -name "*.js" -o -name "*.sh" -o -name "*.env*" \) -not -path "*/.git/*" -not -path "*/.cache/*" | xargs grep -E -l -i "password[[:space:]]*=[[:space:]]*['\"]" 2>/dev/null | grep -v "example" || true)
          if [ -n "$matches" ]; then
            echo "⚠️ Potential sensitive data found in source files:"
            echo "$matches"
            exit 1
          fi
          echo "✅ No secrets detected in source code"

  # Build Docker images
  build-images:
    runs-on: ubuntu-latest
    needs: [load-config, security-validation]
    if: github.event_name != 'pull_request'
    
    strategy:
      matrix:
        service: [web-frontend-server, application-backend-server, internal-dns-server]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and test ${{ matrix.service }}
        run: |
          cd ${{ needs.load-config.outputs.main-directory || 'tranhuunhanminiclouddemo' }}
          
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "🔨 Building ${{ matrix.service }}..."
            
            # Build image
            docker build -t myminicloud-${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
            docker build -t myminicloud-${{ matrix.service }}:latest ./${{ matrix.service }}
            
            # Test image
            echo "🧪 Testing ${{ matrix.service }} image..."
            docker run --rm -d --name test-${{ matrix.service }} myminicloud-${{ matrix.service }}:latest || true
            sleep 5
            docker logs test-${{ matrix.service }} || true
            docker stop test-${{ matrix.service }} || true
            
            echo "✅ ${{ matrix.service }} build completed"
          else
            echo "⚠️ No Dockerfile found for ${{ matrix.service }}, skipping"
          fi
      
      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          cd ${{ needs.load-config.outputs.main-directory || 'tranhuunhanminiclouddemo' }}
          
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "📤 Pushing ${{ matrix.service }} to Docker Hub..."
            
            # Tag and push
            docker tag myminicloud-${{ matrix.service }}:latest ${{ secrets.DOCKER_USERNAME }}/myminicloud-${{ matrix.service }}:latest
            docker tag myminicloud-${{ matrix.service }}:latest ${{ secrets.DOCKER_USERNAME }}/myminicloud-${{ matrix.service }}:${{ github.sha }}
            
            docker push ${{ secrets.DOCKER_USERNAME }}/myminicloud-${{ matrix.service }}:latest
            docker push ${{ secrets.DOCKER_USERNAME }}/myminicloud-${{ matrix.service }}:${{ github.sha }}
            
            echo "✅ ${{ matrix.service }} pushed successfully"
          fi

  # Integration testing
  integration-test:
    runs-on: ubuntu-latest
    needs: [load-config, security-validation]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup environment
        run: |
          cd ${{ needs.load-config.outputs.main-directory || 'tranhuunhanminiclouddemo' }}
          
          # Create .env file if needed
          if [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          
          # Make scripts executable
          chmod +x ../.github/scripts/*.sh
          if [ -f "health-check.sh" ]; then
            chmod +x health-check.sh
          fi
      
      - name: Start services
        run: |
          cd ${{ needs.load-config.outputs.main-directory || 'tranhuunhanminiclouddemo' }}
          
          echo "🚀 Starting all services..."
          docker compose up -d
          
          echo "⏳ Waiting for services to be ready..."
          sleep 90
          
          echo "📊 Service status:"
          docker compose ps
      
      - name: Run comprehensive health check
        run: |
          cd ${{ needs.load-config.outputs.main-directory || 'tranhuunhanminiclouddemo' }}
          
          # Use universal health check if available, fallback to project-specific
          if [ -f "../.github/scripts/universal-health-check.sh" ]; then
            echo "🔍 Running universal health check..."
            ../.github/scripts/universal-health-check.sh
          elif [ -f "health-check.sh" ]; then
            echo "🔍 Running project health check..."
            ./health-check.sh
          else
            echo "⚠️ No health check script found, running basic checks..."
            
            # Basic API tests
            curl -f http://localhost/api/hello || echo "Hello API failed"
            curl -f http://localhost/student/ || echo "Student API failed"
            
            # Basic load balancer test
            for i in {1..3}; do
              curl -s http://localhost | grep -o "Server [12]" || echo "No server info"
            done
          fi
      
      - name: Collect logs on failure
        if: failure()
        run: |
          cd ${{ needs.load-config.outputs.main-directory || 'tranhuunhanminiclouddemo' }}
          echo "📋 Collecting logs for debugging..."
          docker compose logs --tail=100
          docker compose ps
      
      - name: Cleanup
        if: always()
        run: |
          cd ${{ needs.load-config.outputs.main-directory || 'tranhuunhanminiclouddemo' }}
          docker compose down -v
          docker system prune -f

  # Deploy to staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [integration-test, build-images]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MINICLOUD_SSH_KEY }}" | tr -d '\r' > ~/.ssh/minicloud-key.pem
          chmod 600 ~/.ssh/minicloud-key.pem
          
          # Clean the host variable to remove http:// or spaces
          HOST=$(echo "${{ secrets.MINICLOUD_HOST }}" | sed -e 's|^http://||' -e 's|^https://||' -e 's|/$||' | tr -d ' ' | tr -d '\r')
          echo "CLEAN_HOST=$HOST" >> $GITHUB_ENV
          
          # SSH config to prevent blocking prompts
          cat <<EOF > ~/.ssh/config
          Host *
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          
          # Safe keyscan (won't fail the build if it errors)
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts || true
      
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to Staging on $CLEAN_HOST..."
          
          # Copy deployment script to server
          scp -v -i ~/.ssh/minicloud-key.pem .github/scripts/deploy.sh ubuntu@$CLEAN_HOST:/tmp/
          
          # Run deployment
          ssh -v -i ~/.ssh/minicloud-key.pem ubuntu@$CLEAN_HOST '
            export PROJECT_NAME="MyMiniCloud"
            export DEPLOY_PATH="/home/ubuntu/MyMiniCloud/tranhuunhanminiclouddemo"
            export BRANCH="develop"
            export BACKUP_ENABLED="true"
            
            chmod +x /tmp/deploy.sh
            /tmp/deploy.sh
          '
          
          echo "✅ Staging deployment completed"

  # Deploy to production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [integration-test, build-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MINICLOUD_SSH_KEY }}" | tr -d '\r' > ~/.ssh/minicloud-key.pem
          chmod 600 ~/.ssh/minicloud-key.pem
          
          # Clean the host variable to remove http:// or spaces
          HOST=$(echo "${{ secrets.MINICLOUD_HOST }}" | sed -e 's|^http://||' -e 's|^https://||' -e 's|/$||' | tr -d ' ' | tr -d '\r')
          echo "CLEAN_HOST=$HOST" >> $GITHUB_ENV
          
          # SSH config to prevent blocking prompts
          cat <<EOF > ~/.ssh/config
          Host *
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          
          # Safe keyscan (won't fail the build if it errors)
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts || true
      
      - name: Deploy to production
        run: |
          echo "🚀 Deploying to Production on $CLEAN_HOST..."
          
          # Copy deployment script to server
          scp -v -i ~/.ssh/minicloud-key.pem .github/scripts/deploy.sh ubuntu@$CLEAN_HOST:/tmp/
          
          # Run deployment
          ssh -v -i ~/.ssh/minicloud-key.pem ubuntu@$CLEAN_HOST '
            export PROJECT_NAME="MyMiniCloud"
            export DEPLOY_PATH="/home/ubuntu/MyMiniCloud/tranhuunhanminiclouddemo"
            export BRANCH="main"
            export BACKUP_ENABLED="true"
            
            chmod +x /tmp/deploy.sh
            /tmp/deploy.sh
          '
          
          echo "✅ Production deployment completed"
      
      - name: Notify team
        run: |
          echo "📢 MyMiniCloud v${{ github.sha }} deployed to production!"
          # Add Slack/Discord notification here if needed
